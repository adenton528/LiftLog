<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>LiftLog — Personal Workout Tracker</title>
<style>
:root{--bg:#0b1020;--panel:#141b2d;--panel2:#1b253a;--line:#2b3650;--text:#f3f6fc;--muted:#a3afc4;--accent:#9be15d;--accent2:#c4f28e;--warn:#f7c66a;--red:#ff8d8d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#10172a 65%,#0b1020);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:920px;margin:auto;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 18px;gap:12px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#14210a;display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#0e1526;padding:5px;border:1px solid var(--line);border-radius:16px;margin-bottom:20px}.tab{background:transparent;border:0;color:var(--muted);padding:10px 4px;border-radius:11px;font-size:13px}.tab.active{background:var(--panel2);color:var(--text);font-weight:700}
h2{font-size:24px;letter-spacing:-.7px;margin:4px 0 5px}h3{font-size:16px;margin:0 0 12px}.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:rgba(20,27,45,.95);border:1px solid var(--line);border-radius:19px;padding:17px;min-width:0}.metric{font-size:28px;font-weight:800;letter-spacing:-1px}.metric-label{color:var(--muted);font-size:12px;margin-top:3px}.section{margin-top:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:750;background:var(--accent);color:#14210a}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.btn.danger{background:#48252d;color:#ffdadd;border:1px solid #70404a}.btn:disabled{opacity:.4;cursor:not-allowed}.full{width:100%}.stack{display:flex;flex-direction:column;gap:10px}.exercise{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.ex-icon{width:43px;height:43px;flex:0 0 43px;border-radius:13px;background:#26334a;display:grid;place-items:center;font-size:20px}.ex-info{flex:1;min-width:0}.ex-info strong{display:block;font-size:14px}.ex-info span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.tag{font-size:11px;color:var(--accent2);background:#263a28;border-radius:7px;padding:4px 7px;white-space:nowrap}
.notice{border:1px solid #685735;background:#2b261a;color:#f6dfad;border-radius:15px;padding:13px 14px;font-size:13px;margin-bottom:16px}.notice strong{display:block;margin-bottom:3px}.notice.ok{border-color:#375a35;background:#17291c;color:#c9f6b6}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;min-width:0;background:#0d1424;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.filter{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;font-size:12px}.filter.active{color:#14210a;background:var(--accent);border-color:var(--accent);font-weight:800}
.empty{padding:25px 10px;text-align:center;color:var(--muted);font-size:14px}.history-item{padding:14px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-item strong{font-size:14px}.history-item p{margin:4px 0 0;color:var(--muted);font-size:12px}
.setrow{display:grid;grid-template-columns:42px 1fr 1fr 38px;gap:8px;align-items:center;margin:8px 0}.setrow .field{margin:0}.setnum{color:var(--muted);font-size:12px}.check{height:38px;width:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:18px}.check.done{background:var(--accent);color:#14210a;border-color:var(--accent)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(11,16,32,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.bottom-inner{width:100%;max-width:888px;display:flex;gap:10px}
.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#f3f6fc;color:#111827;padding:10px 15px;border-radius:12px;font-size:13px;font-weight:700;z-index:10;box-shadow:0 8px 30px #0005}
@media(min-width:700px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.tabs{max-width:560px}.main-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.mobile-only{display:none}}
@media(max-width:420px){.app{padding-left:12px;padding-right:12px}.card{padding:14px}.metric{font-size:25px}.tabs{gap:2px}.tab{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo">L</div><div><h1>LiftLog</h1><p>Your personal strength tracker</p></div></div>
 <span class="pill" id="statusPill">Setup mode</span>
</header>
<nav class="tabs" aria-label="Main navigation">
 <button class="tab active" data-tab="home">Overview</button><button class="tab" data-tab="workout">Workout</button><button class="tab" data-tab="library">Exercises</button><button class="tab" data-tab="history">History</button>
</nav>
<main id="view"></main>
</div>
<div id="bottom" class="bottom hidden"><div class="bottom-inner"><button class="btn secondary" id="cancelWorkout">Cancel</button><button class="btn full" id="finishWorkout">Finish workout</button></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const EXERCISES=[
{id:'db-press',name:'Dumbbell Chest Press',group:'Chest',type:'Dumbbell',note:'Bench-supported press',icon:'↗'},
{id:'db-fly',name:'Dumbbell Fly',group:'Chest',type:'Dumbbell',note:'Controlled range of motion',icon:'✣'},
{id:'squeeze-press',name:'Dumbbell Squeeze Press',group:'Chest',type:'Dumbbell',note:'Press dumbbells together',icon:'◈'},
{id:'chest-row',name:'Chest-Supported Dumbbell Row',group:'Back',type:'Dumbbell',note:'Chest supported on incline bench',icon:'↙'},
{id:'incline-row',name:'Incline-Bench Dumbbell Row',group:'Back',type:'Dumbbell',note:'Use a stable bench position',icon:'↙'},
{id:'pulldown',name:'Neutral-Grip Lat Pulldown',group:'Back',type:'Cable / Machine',note:'Optional machine alternative',icon:'↓'},
{id:'lateral',name:'Seated Dumbbell Lateral Raise',group:'Shoulders',type:'Dumbbell',note:'Light weight, controlled reps',icon:'↔'},
{id:'rear-delt',name:'Chest-Supported Rear-Delt Raise',group:'Shoulders',type:'Dumbbell',note:'Chest supported on incline bench',icon:'✣'},
{id:'curl',name:'Seated Dumbbell Curl',group:'Biceps',type:'Dumbbell',note:'Keep torso supported and still',icon:'↑'},
{id:'hammer',name:'Seated Hammer Curl',group:'Biceps',type:'Dumbbell',note:'Neutral grip',icon:'↑'},
{id:'triceps',name:'Supported Triceps Extension',group:'Triceps',type:'Dumbbell',note:'Only when cleared for this movement',icon:'↗'},
{id:'pushdown',name:'Cable Triceps Pushdown',group:'Triceps',type:'Cable / Machine',note:'Optional machine alternative',icon:'↓'},
{id:'pecdeck',name:'Pec Deck',group:'Chest',type:'Cable / Machine',note:'Optional machine alternative',icon:'✣'},
{id:'machine-press',name:'Seated Chest Press Machine',group:'Chest',type:'Cable / Machine',note:'Optional machine alternative',icon:'↗'}
];
const GROUPS=['All','Chest','Back','Shoulders','Biceps','Triceps'];
const KEY='liftlog-v1';
let state=loadState(), tab='home', filter='All', active=null, workout=null, timerId=null, restRemaining=0;
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{cleared:false,sessions:[],templates:[],personalNotes:'',unit:'lb'}}catch(e){return{cleared:false,sessions:[],templates:[],personalNotes:'',unit:'lb'}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d){return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function lastSet(id){for(const s of [...state.sessions].reverse()){const e=s.exercises?.find(x=>x.id===id);if(e&&e.sets?.length)return e.sets[e.sets.length-1]}return null}
function render(){document.getElementById('statusPill').textContent=state.cleared?'Training enabled':'Setup mode';document.getElementById('bottom').classList.toggle('hidden',!workout);const v=document.getElementById('view');if(tab==='home')v.innerHTML=homeView();if(tab==='workout')v.innerHTML=workoutView();if(tab==='library')v.innerHTML=libraryView();if(tab==='history')v.innerHTML=historyView();bindView()}
function homeView(){
const sessions=state.sessions.length, sets=state.sessions.reduce((n,s)=>n+s.exercises.reduce((m,e)=>m+e.sets.filter(x=>x.done).length,0),0), latest=state.sessions.at(-1);
return `<div class="notice ${state.cleared?'ok':''}"><strong>${state.cleared?'Training mode enabled':'Setup mode — workouts are locked'}</strong>${state.cleared?'Only train within the restrictions provided by your surgical team. This tracker does not determine medical clearance.':'Build your exercise library and templates now. Workout logging stays locked until you explicitly enable it after your surgeon clears you.'}</div>
<h2>Your training, organized.</h2><p class="sub">A straightforward log for dumbbell-focused strength training.</p>
<div class="grid"><div class="card"><div class="metric">${sessions}</div><div class="metric-label">Workouts logged</div></div><div class="card"><div class="metric">${sets}</div><div class="metric-label">Completed sets</div></div><div class="card"><div class="metric">${EXERCISES.length}</div><div class="metric-label">Exercises in library</div></div><div class="card"><div class="metric">${state.templates.length}</div><div class="metric-label">Saved routines</div></div></div>
<div class="main-layout"><div class="section"><div class="row"><h3>Start here</h3><span class="muted small">Personal setup</span></div><div class="card stack">
<button class="btn full" data-action="new-template">＋ Build a workout template</button><button class="btn secondary full" data-go="library">Browse exercise library</button><button class="btn secondary full" data-go="history">Review workout history</button>
</div>
<div class="section"><h3>Recent activity</h3><div class="card">${latest?`<div class="row"><div><strong>${esc(latest.name||'Workout')}</strong><div class="muted small">${fmtDate(latest.date)}</div></div><span class="tag">${latest.exercises.length} exercises</span></div>`:`<div class="empty">Your completed workouts will appear here once training is enabled and you begin logging.</div>`}</div></div>
</div><div class="section"><h3>Designed around your preferences</h3><div class="card stack"><div class="row"><span>Default equipment</span><strong>Dumbbells</strong></div><div class="row"><span>Exercise focus</span><strong>Upper body</strong></div><div class="row"><span>Progress records</span><strong>Weight + reps</strong></div><div class="row"><span>Data storage</span><strong>This browser</strong></div><p class="muted small">Data is stored on this device/browser. Use Settings below to export a backup.</p><button class="btn ghost full" data-action="settings">Settings & backup</button></div></div></div>`;
}
function libraryView(){let list=EXERCISES.filter(e=>(filter==='All'||e.group===filter)&&`${e.name} ${e.group} ${e.type}`.toLowerCase().includes((document.getElementById('searchEx')?.value||'').toLowerCase()));return `<h2>Exercise library</h2><p class="sub">Simple upper-body options. These are reference entries, not clearance to perform them.</p><div class="field"><input id="searchEx" placeholder="Search exercises…" value="${esc(document.getElementById('searchEx')?.value||'')}"></div><div class="filters">${GROUPS.map(g=>`<button class="filter ${filter===g?'active':''}" data-filter="${g}">${g}</button>`).join('')}</div><div class="card">${list.length?list.map(e=>`<div class="exercise"><div class="ex-icon">${e.icon}</div><div class="ex-info"><strong>${esc(e.name)}</strong><span>${e.group} · ${e.type}</span><span>${esc(e.note)}</span></div><button class="btn secondary" data-action="details" data-id="${e.id}" aria-label="View ${esc(e.name)}">Info</button></div>`).join(''):'<div class="empty">No matching exercises.</div>'}</div><div class="section"><button class="btn secondary full" data-action="new-template">＋ Create routine from exercises</button></div>`}
function workoutView(){if(!state.cleared)return `<h2>Workout</h2><p class="sub">Ready when your care team clears you to train.</p><div class="card"><div class="empty">Workout logging is currently locked in setup mode.</div><button class="btn full" data-action="settings">Open settings to enable training later</button></div><div class="section"><h3>Saved routines</h3>${templateList()}</div>`;if(!workout)return `<h2>Workout</h2><p class="sub">Choose a saved routine or start a blank session.</p><div class="stack"><button class="btn full" data-action="start-empty">＋ Start blank workout</button>${state.templates.map(t=>`<div class="card row"><div><strong>${esc(t.name)}</strong><div class="muted small">${t.exerciseIds.length} exercises</div></div><button class="btn secondary" data-action="start-template" data-id="${t.id}">Start</button></div>`).join('')||'<div class="card empty">No routines yet. Create one from the Exercises tab.</div>'}</div>`;return activeWorkoutView()}
function templateList(){return `<div class="card">${state.templates.length?state.templates.map(t=>`<div class="history-item row"><div><strong>${esc(t.name)}</strong><p>${t.exerciseIds.length} exercises</p></div><button class="btn secondary" data-action="edit-template" data-id="${t.id}">Edit</button></div>`).join(''):'<div class="empty">No saved routines yet.</div>'}</div>`}
function activeWorkoutView(){return `<div class="row"><div><h2>${esc(workout.name)}</h2><p class="sub">Started ${new Date(workout.started).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</p></div><span class="tag">${workout.exercises.length} exercises</span></div>${workout.exercises.map((e,i)=>`<div class="card section"><div class="row"><div><h3>${esc(e.name)}</h3><div class="muted small">${e.group} · ${e.type}</div></div><button class="btn ghost" data-action="remove-workout-ex" data-index="${i}">Remove</button></div><div class="muted small">Previous: ${lastSet(e.id)?`${lastSet(e.id).weight} ${state.unit} × ${lastSet(e.id).reps}`:'No history yet'}</div><div class="setrow"><span class="setnum">SET</span><span class="small muted">WEIGHT (${state.unit})</span><span class="small muted">REPS</span><span></span></div>${e.sets.map((s,j)=>`<div class="setrow"><span class="setnum">${j+1}</span><div class="field"><input type="number" min="0" step="0.5" inputmode="decimal" data-set-field="weight" data-e="${i}" data-s="${j}" value="${esc(s.weight)}" placeholder="0"></div><div class="field"><input type="number" min="0" step="1" inputmode="numeric" data-set-field="reps" data-e="${i}" data-s="${j}" value="${esc(s.reps)}" placeholder="0"></div><button class="check ${s.done?'done':''}" data-action="toggle-set" data-e="${i}" data-s="${j}">${s.done?'✓':'○'}</button></div>`).join('')}<div class="row" style="margin-top:12px"><button class="btn secondary" data-action="add-set" data-index="${i}">＋ Add set</button><span class="muted small">${e.sets.filter(s=>s.done).length} / ${e.sets.length} done</span></div></div>`).join('')||'<div class="card empty">Add exercises from the library.</div>'}<div class="section card"><h3>Add exercise</h3><div class="field"><select id="addExercise"><option value="">Choose exercise…</option>${EXERCISES.map(e=>`<option value="${e.id}">${esc(e.name)} — ${e.group}</option>`).join('')}</select></div><button class="btn secondary full" data-action="add-exercise">Add to workout</button></div><div class="section card"><h3>Rest timer</h3><div class="row"><div><div class="metric" id="timerDisplay">${formatTimer(restRemaining)}</div><div class="metric-label">Time remaining</div></div><div class="row"><button class="btn secondary" data-action="rest" data-seconds="60">60s</button><button class="btn secondary" data-action="rest" data-seconds="90">90s</button></div></div><button class="btn ghost full" style="margin-top:10px" data-action="stop-timer">Stop timer</button></div>`}
function formatTimer(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function historyView(){return `<h2>Workout history</h2><p class="sub">Completed sessions and recorded performance.</p><div class="card">${state.sessions.length?[...state.sessions].reverse().map(s=>`<div class="history-item"><div class="row"><strong>${esc(s.name||'Workout')}</strong><span class="muted small">${fmtDate(s.date)}</span></div><p>${s.exercises.length} exercises · ${s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0)} completed sets</p><details style="margin-top:10px"><summary class="small muted">View session details</summary>${s.exercises.map(e=>`<p><strong>${esc(e.name)}</strong><br>${e.sets.filter(x=>x.done).map((x,i)=>`Set ${i+1}: ${x.weight} ${state.unit} × ${x.reps}`).join(' · ')||'No completed sets'}</p>`).join('')}</details></div>`).join(''):'<div class="empty">No workouts recorded yet. When training is enabled, completed sessions will appear here.</div>'}</div><div class="section"><button class="btn secondary full" data-action="settings">Settings & export backup</button></div>`}
function bindView(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset));const search=document.getElementById('searchEx');if(search)search.oninput=()=>{let p=search.selectionStart;render();let n=document.getElementById('searchEx');n.focus();n.setSelectionRange(p,p)};document.querySelectorAll('[data-set-field]').forEach(inp=>inp.onchange=()=>{let e=+inp.dataset.e,s=+inp.dataset.s;workout.exercises[e].sets[s][inp.dataset.setField]=inp.value;save()})}
function action(a,d={}){if(a==='settings')return settingsModal();if(a==='new-template')return templateModal();if(a==='details'){const e=EXERCISES.find(x=>x.id===d.id);alert(`${e.name}\n\nMuscle group: ${e.group}\nEquipment: ${e.type}\n\n${e.note}\n\nConfirm any movement restrictions with your surgical team before adding this exercise to an active routine.`);return}if(a==='start-empty'){workout={name:'Upper Body Workout',started:new Date().toISOString(),exercises:[]};setTab('workout');return}if(a==='start-template'){let t=state.templates.find(x=>x.id===d.id);workout={name:t.name,started:new Date().toISOString(),exercises:t.exerciseIds.map(id=>{let e=EXERCISES.find(x=>x.id===id);return {...e,sets:[{weight:'',reps:'',done:false},{weight:'',reps:'',done:false},{weight:'',reps:'',done:false}]}})};setTab('workout');return}if(a==='edit-template')return templateModal(d.id);if(a==='add-exercise'){let id=document.getElementById('addExercise').value,e=EXERCISES.find(x=>x.id===id);if(!e)return toast('Choose an exercise first');if(workout.exercises.some(x=>x.id===id))return toast('Exercise already added');workout.exercises.push({...e,sets:[{weight:'',reps:'',done:false},{weight:'',reps:'',done:false},{weight:'',reps:'',done:false}]});render();return}if(a==='add-set'){workout.exercises[+d.index].sets.push({weight:'',reps:'',done:false});render();return}if(a==='toggle-set'){let s=workout.exercises[+d.e].sets[+d.s];s.done=!s.done;save();render();return}if(a==='remove-workout-ex'){workout.exercises.splice(+d.index,1);render();return}if(a==='rest'){startTimer(+d.seconds);return}if(a==='stop-timer'){clearInterval(timerId);restRemaining=0;render();return}}
function settingsModal(){let overlay=document.createElement('div');overlay.className='modal-overlay';overlay.style.cssText='position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:16px';overlay.innerHTML=`<div class="card" style="width:min(100%,520px);max-height:90vh;overflow:auto"><div class="row"><h2>Settings & backup</h2><button class="btn ghost" id="closeModal">Close</button></div><p class="sub">Your data is saved in this browser on this device.</p><div class="notice"><strong>Training permission</strong>Only enable workout logging after your surgeon or care team clears you to exercise. This toggle does not provide medical clearance.</div><label class="row" style="margin-bottom:16px"><span><strong>Enable workout logging</strong><div class="muted small">Unlock the workout tab</div></span><input id="clearToggle" type="checkbox" ${state.cleared?'checked':''} style="width:24px;height:24px"></label><div class="field"><label>Weight unit</label><select id="unitSelect"><option value="lb" ${state.unit==='lb'?'selected':''}>Pounds (lb)</option><option value="kg" ${state.unit==='kg'?'selected':''}>Kilograms (kg)</option></select></div><div class="field"><label>Notes for your return to training</label><textarea id="notes" rows="3" placeholder="Optional notes from your care team or restrictions to remember">${esc(state.personalNotes)}</textarea></div><div class="stack"><button class="btn full" id="exportData">Export backup (JSON)</button><label class="btn secondary full" style="text-align:center">Import backup<input id="importData" type="file" accept=".json,application/json" class="hidden"></label><button class="btn danger full" id="clearData">Delete all workout data</button></div><p class="muted small">Export backups periodically. Clearing Safari website data or changing browsers/devices can remove local records.</p></div>`;document.body.appendChild(overlay);overlay.querySelector('#closeModal').onclick=()=>overlay.remove();overlay.querySelector('#clearToggle').onchange=e=>{if(e.target.checked&&!confirm('Enable workout logging only if your surgical team has cleared you to exercise. Continue?')){e.target.checked=false;return}state.cleared=e.target.checked;save();overlay.remove();render()};overlay.querySelector('#unitSelect').onchange=e=>{state.unit=e.target.value;save();render()};overlay.querySelector('#notes').onchange=e=>{state.personalNotes=e.target.value;save()};overlay.querySelector('#exportData').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='liftlog-backup.json';a.click();URL.revokeObjectURL(url)};overlay.querySelector('#importData').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.sessions)||!Array.isArray(x.templates))throw Error();state={...state,...x};save();overlay.remove();render();toast('Backup imported')}catch(err){alert('That file does not look like a LiftLog backup.')}};overlay.querySelector('#clearData').onclick=()=>{if(confirm('Permanently delete all LiftLog workout history, templates, and settings from this browser?')){localStorage.removeItem(KEY);state=loadState();overlay.remove();render();toast('Local data cleared')}}}
function templateModal(id){let old=state.templates.find(t=>t.id===id),selected=new Set(old?.exerciseIds||[]);let overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:16px';overlay.innerHTML=`<div class="card" style="width:min(100%,560px);max-height:90vh;overflow:auto"><div class="row"><h2>${old?'Edit':'Build'} routine</h2><button class="btn ghost" id="closeTemplate">Close</button></div><div class="field"><label>Routine name</label><input id="routineName" value="${esc(old?.name||'Upper Body A')}" maxlength="60"></div><p class="muted small">Choose exercises to save in this routine. You can change it later.</p><div id="routineExercises">${EXERCISES.map(e=>`<label class="exercise" style="cursor:pointer"><input type="checkbox" data-routine-id="${e.id}" ${selected.has(e.id)?'checked':''} style="width:20px;height:20px"><div class="ex-icon">${e.icon}</div><div class="ex-info"><strong>${esc(e.name)}</strong><span>${e.group} · ${e.type}</span></div></label>`).join('')}</div><div class="stack" style="margin-top:16px"><button class="btn full" id="saveRoutine">Save routine</button>${old?'<button class="btn danger full" id="deleteRoutine">Delete routine</button>':''}</div></div>`;document.body.appendChild(overlay);overlay.querySelector('#closeTemplate').onclick=()=>overlay.remove();overlay.querySelector('#saveRoutine').onclick=()=>{let name=overlay.querySelector('#routineName').value.trim();selected=new Set([...overlay.querySelectorAll('[data-routine-id]:checked')].map(x=>x.dataset.routineId));if(!name)return alert('Enter a routine name.');if(!selected.size)return alert('Choose at least one exercise.');if(old){old.name=name;old.exerciseIds=[...selected]}else state.templates.push({id:crypto.randomUUID(),name,exerciseIds:[...selected]});save();overlay.remove();render();toast('Routine saved')};if(old)overlay.querySelector('#deleteRoutine').onclick=()=>{if(confirm('Delete this routine?')){state.templates=state.templates.filter(t=>t.id!==old.id);save();overlay.remove();render()}}}
function startTimer(n){clearInterval(timerId);restRemaining=n;render();timerId=setInterval(()=>{restRemaining=Math.max(0,restRemaining-1);let el=document.getElementById('timerDisplay');if(el)el.textContent=formatTimer(restRemaining);if(restRemaining===0){clearInterval(timerId);toast('Rest timer complete')}} ,1000)}
document.getElementById('finishWorkout').onclick=()=>{if(!workout)return;if(!workout.exercises.length)return alert('Add at least one exercise before finishing.');if(!confirm('Save this workout to your history?'))return;state.sessions.push({id:crypto.randomUUID(),name:workout.name,date:new Date().toISOString(),exercises:workout.exercises.map(e=>({id:e.id,name:e.name,group:e.group,sets:e.sets.map(s=>({...s}))}))});save();workout=null;clearInterval(timerId);restRemaining=0;setTab('history');toast('Workout saved')};
document.getElementById('cancelWorkout').onclick=()=>{if(confirm('Discard this in-progress workout?')){workout=null;clearInterval(timerId);restRemaining=0;render()}};
render();
</script>
</body>
</html>
